name: narda
description: >-
  «Uzun narda» — длинные нарды с узбекским интерфейсом: доска на CustomPaint,
  игра против бота, hotseat на одном устройстве и онлайн.
publish_to: none
version: 0.4.0+4

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.3.0
  audioplayers: ^6.8.1
  vibration: ^3.2.0
  google_mobile_ads: ^9.0.0
  narda_core:
    path: ../packages/narda_core
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  firebase_database: ^12.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/sounds/
