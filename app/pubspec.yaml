name: narda
description: >-
  «Uzun narda» — длинные нарды с узбекским интерфейсом: доска на CustomPaint,
  игра против бота и hotseat на одном устройстве.
publish_to: none
version: 0.3.0+3

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.3.0
  audioplayers: ^6.8.1
  vibration: ^3.2.0
  google_mobile_ads: ^9.0.0
  narda_core:
    path: ../packages/narda_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/sounds/
